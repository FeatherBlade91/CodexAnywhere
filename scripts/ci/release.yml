name: Desktop release
on:
  push:
    tags: ['v1.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - name: Verify packaged application
        run: node tests/packaged.mjs
      - name: Checksum installer
        shell: pwsh
        run: |
          Get-ChildItem dist/Codex-Anywhere-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 "dist/$($_.Name).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Anywhere-desktop
          path: |
            dist/Codex-Anywhere-Setup-*.exe
            dist/*.sha256
      - name: Publish desktop release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME dist/Codex-Anywhere-Setup-*.exe dist/*.sha256 --title "Codex-Anywhere $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0

  macos:
    name: macOS / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - name: Build Mac disk image
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac -- --${{ matrix.arch }}
          else
            npm run dist:mac:preview -- --${{ matrix.arch }}
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: node tests/packaged.mjs
      - name: Checksum disk image
        run: |
          cd dist
          for file in Codex-Anywhere-*-mac-*.dmg; do shasum -a 256 "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Anywhere-mac-${{ matrix.arch }}
          path: |
            dist/Codex-Anywhere-*-mac-*.dmg
            dist/*.sha256

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0 libgtk-3-0t64 libasound2t64 libfuse2t64
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a bash scripts/test-linux.sh
      - run: npm run dist:linux
      - run: xvfb-run -a bash scripts/test-linux.sh node tests/packaged.mjs
      - name: Checksum Linux packages
        run: |
          cd dist
          sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Anywhere-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt
