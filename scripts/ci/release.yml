name: Desktop release
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - name: Verify packaged application
        run: node tests/packaged.mjs
      - name: Checksum installer
        shell: pwsh
        run: |
          Get-ChildItem dist/ChatGPT-Bridge-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 "dist/$($_.Name).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Bridge-desktop
          path: |
            dist/ChatGPT-Bridge-Setup-*.exe
            dist/*.sha256
      - name: Publish desktop release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME dist/ChatGPT-Bridge-Setup-*.exe dist/*.sha256 --title "ChatGPT Bridge $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
